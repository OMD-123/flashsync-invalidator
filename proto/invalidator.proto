syntax = "proto3"; package invalidator; service CacheManager { rpc InvalidateKey (InvalidateRequest) returns (InvalidateResponse); rpc InvalidateBatch (BatchInvalidateRequest) returns (InvalidateResponse); } message InvalidateRequest { string sku = 1; } message BatchInvalidateRequest { repeated string skus = 1; } message InvalidateResponse { bool success = 1; string message = 2; }
